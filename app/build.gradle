plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.kamil.tvpodglad'
    compileSdk 34

    defaultConfig {
        applicationId 'pl.kamil.tvpodglad'
        minSdk 26          // Android 8.0 Oreo (Philips Android TV)
        targetSdk 28
        versionCode 4
        versionName '2.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
