plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.kamil.tvpodglad'
    compileSdk 34

    defaultConfig {
        applicationId 'pl.kamil.tvpodglad'
        minSdk 26          // Android 8.0 Oreo (Philips Android TV)
        targetSdk 28       // celowo niski - prostsze zasady usług w tle na TV
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
